name: Queue local Mer comment refresh

on:
  workflow_dispatch:
    inputs:
      log_no:
        description: Naver blog logNo already present in the report state
        required: true
        type: string
  repository_dispatch:
    types: [manual-mer-comment-refresh]

concurrency:
  group: queue-local-mer-comment-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report state
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate target
        id: target
        env:
          REQUESTED_LOG_NO: ${{ github.event.inputs.log_no || github.event.client_payload.logNo }}
        run: |
          if [[ ! "$REQUESTED_LOG_NO" =~ ^[0-9]{8,20}$ ]]; then
            echo "Invalid logNo" >&2
            exit 1
          fi
          python - "$REQUESTED_LOG_NO" <<'PY'
          import json, sys
          state = json.load(open('.mer-curation-state.json', encoding='utf-8'))
          if sys.argv[1] not in state.get('posts', {}):
              raise SystemExit('logNo is not present in the report state')
          PY
          echo "log_no=$REQUESTED_LOG_NO" >> "$GITHUB_OUTPUT"

      - name: Add request to the local worker queue
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_NO: ${{ steps.target.outputs.log_no }}
        run: |
          LABEL="mer-local-refresh"
          TITLE="[mer-local-refresh] ${LOG_NO}"
          gh label create "$LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color "194F3D" \
            --description "Queued for the trusted local Mer comment worker" \
            --force
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$LABEL" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -n 1)
          if [[ -n "$EXISTING" ]]; then
            echo "Request already queued in issue #${EXISTING}."
            exit 0
          fi
          cat > "$RUNNER_TEMP/request.md" <<EOF
          This issue is a machine-readable request for the trusted local worker.

          log_no: ${LOG_NO}
          requested_at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          requested_by: ${GITHUB_ACTOR}
          EOF
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label "$LABEL" \
            --body-file "$RUNNER_TEMP/request.md"
